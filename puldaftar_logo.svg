<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B88F"/>
      <stop offset="1" stop-color="#0A6E7C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9FBF5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#053B40" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fon (Telegram doira qilib kesadi — hamma narsa markazda) -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>

  <g transform="translate(320 330) scale(1.12) translate(-320 -320)">
  <!-- daftar -->
  <g filter="url(#sh)">
    <rect x="178" y="150" width="284" height="340" rx="38" fill="url(#page)"/>
  </g>
  <!-- daftar chap tomoni (muqova chizig'i) -->
  <rect x="178" y="150" width="46" height="340" rx="38" fill="#CDEFE4"/>
  <rect x="200" y="150" width="24" height="340" fill="#CDEFE4"/>
  <!-- spiral halqalar -->
  <g fill="#0A6E7C">
    <circle cx="201" cy="208" r="9"/>
    <circle cx="201" cy="268" r="9"/>
    <circle cx="201" cy="328" r="9"/>
    <circle cx="201" cy="388" r="9"/>
    <circle cx="201" cy="448" r="9"/>
  </g>

  <!-- satrlar -->
  <g stroke="#D6EDE6" stroke-width="10" stroke-linecap="round">
    <line x1="258" y1="210" x2="420" y2="210"/>
    <line x1="258" y1="250" x2="380" y2="250"/>
  </g>

  <!-- o'suvchi grafik -->
  <polyline points="258,420 308,372 348,396 420,312" fill="none" stroke="#0FA37F" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="312" r="19" fill="#0FA37F"/>
  <circle cx="420" cy="312" r="8" fill="#FFFFFF"/>

  <!-- AI uchqun -->
  <g transform="translate(470,160)">
    <path d="M0,-58 C6,-18 18,-6 58,0 C18,6 6,18 0,58 C-6,18 -18,6 -58,0 C-18,-6 -6,-18 0,-58 Z" fill="#FFD66B"/>
  </g>
  <g transform="translate(528,238)">
    <path d="M0,-24 C3,-8 8,-3 24,0 C8,3 3,8 0,24 C-3,8 -8,3 -24,0 C-8,-3 -3,-8 0,-24 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
  </g>
</svg>
