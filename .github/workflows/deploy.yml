name: deploy
# main'ga push bo'lganda serverga avtomatik yangilaydi.
# Kerakli GitHub Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
# Secrets qo'yilmagan bo'lsa — job o'tkazib yuboriladi.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SERVER_SSH_KEY != '' }}
    steps:
      - name: Skip (secrets yo'q)
        if: env.HAS_KEY != 'true'
        run: echo "SERVER_SSH_KEY qo'yilmagan — avto-deploy o'chiq."
      - name: SSH orqali yangilash
        if: env.HAS_KEY == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: cd /opt/hisobchi && ./scripts/update.sh
