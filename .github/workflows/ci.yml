name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hisobchi_owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: hisobchi }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      POSTGRES_PASSWORD: owner
      DB_APP_PASSWORD: app
      DATA_ENCRYPTION_KEY: dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
      BOT_TOKEN: "123:TEST"
      TEST_DB_OK: "1"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests || true
      - run: PGPASSWORD=owner psql -h localhost -U hisobchi_owner -d hisobchi -c "CREATE ROLE hisobchi_app LOGIN PASSWORD 'app'"
      - run: python -m app.db.migrate
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
