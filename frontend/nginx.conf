# TLS ni tashqi proxy (nginx + certbot) beradi; bu konteyner ichki HTTP.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    server_tokens off;

    # Haqiqiy foydalanuvchi IP si (rate limit uchun) — tashqi proxy yuboradi
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # api konteyneri qayta yaratilsa IP o'zgaradi — Docker DNS orqali har safar qayta aniqlanadi (502 bo'lmasligi uchun)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Mini app faqat Telegram ichida iframe'da ochiladi
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org 'self'" always;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/admin/ {
        client_max_body_size 10m;          # reklama rasmi uchun
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /webhooks/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
